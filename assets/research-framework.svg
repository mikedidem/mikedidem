<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Michael Edidem's computational AI research connections</title>
  <desc id="description">Computational AI connects four complementary research themes: geospatial AI and spatial intelligence, computer vision and multimodal AI, scientific machine learning and simulation, and AI systems and scientific applications. Scientific simulation is a distinct theme rather than a subset of geospatial AI. The themes include vision-language models, explainable AI and ongoing research in agent workflows.</desc>
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2473ae"/><stop offset="1" stop-color="#238468"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e7ecec" stroke-width=".7"/></pattern>
  </defs>
  <rect x="1" y="1" width="998" height="618" rx="22" fill="#fcfdfb" stroke="#dbe5e3"/>
  <text x="40" y="42" fill="#566a67" font-size="12" font-weight="650" letter-spacing="2">RESEARCH CONNECTIONS</text>
  <text x="40" y="74" fill="#223d42" font-size="24" font-weight="700">Develop methods. Evaluate behavior. Build systems.</text>
  <g stroke="#c8d8d8" stroke-width="2" fill="none">
    <path d="M340 211C395 211 399 287 416 304"/><path d="M660 211C605 211 601 287 584 304"/>
    <path d="M340 450C395 450 399 374 416 357"/><path d="M660 450C605 450 601 374 584 357"/>
  </g>
  <circle cx="500" cy="330" r="117" fill="url(#grid)" stroke="#e0e8e5"/>
  <circle cx="500" cy="330" r="92" fill="url(#hub)"/>
  <g fill="none" stroke="#fff" opacity=".18" stroke-width="1.2"><path d="M442 286L500 263L558 286L558 374L500 397L442 374Z"/><circle cx="500" cy="263" r="4"/><circle cx="442" cy="374" r="4"/><circle cx="558" cy="374" r="4"/></g>
  <text x="500" y="321" text-anchor="middle" fill="#fff" font-size="20" font-weight="750">Computational</text>
  <text x="500" y="351" text-anchor="middle" fill="#fff" font-size="23" font-weight="750">AI</text>
  <text x="500" y="476" text-anchor="middle" fill="#455d62" font-size="14" font-weight="600">Develop · Integrate · Evaluate</text>

  <g>
    <rect x="40" y="122" width="300" height="172" rx="13" fill="#f0f6fb" stroke="#a9c8df"/>
    <g transform="translate(59 140)" fill="none" stroke="#2774aa" stroke-width="1.6"><path d="M0 9L13 2L26 9L13 16ZM0 16L13 23L26 16M0 23L13 30L26 23"/></g>
    <text x="99" y="159" fill="#245f86" font-size="11" font-weight="650" letter-spacing="1">SPATIAL UNDERSTANDING</text>
    <text x="60" y="195" fill="#223d42" font-size="18" font-weight="700">Geospatial AI &amp;</text>
    <text x="60" y="219" fill="#223d42" font-size="18" font-weight="700">spatial intelligence</text>
    <text x="60" y="245" fill="#4b626b" font-size="13">GF embeddings · Spatial generalization</text>
    <text x="60" y="265" fill="#245f86" font-size="12" font-weight="600">How can we learn from sparse,</text>
    <text x="60" y="283" fill="#245f86" font-size="12" font-weight="600">heterogeneous geospatial data?</text>
  </g>
  <g>
    <rect x="660" y="122" width="300" height="172" rx="13" fill="#eff7f1" stroke="#a7cbb6"/>
    <g transform="translate(680 141)" fill="none" stroke="#287958" stroke-width="1.6"><path d="M0 24V0M0 24H28M4 19L11 12L18 16L26 3"/><circle cx="11" cy="12" r="2" fill="#eff7f1"/><circle cx="18" cy="16" r="2" fill="#eff7f1"/></g>
    <text x="719" y="159" fill="#287958" font-size="11" font-weight="650" letter-spacing="1">PHYSICS &amp; SIMULATION</text>
    <text x="680" y="195" fill="#223d42" font-size="18" font-weight="700">Scientific ML &amp; simulation</text>
    <text x="680" y="222" fill="#4b626b" font-size="13">Numerical models · Surrogate modeling</text>
    <text x="680" y="245" fill="#4b626b" font-size="13">Accuracy · Model behavior · Conservation</text>
    <text x="680" y="265" fill="#287958" font-size="12" font-weight="600">How can we build fast, accurate models</text>
    <text x="680" y="283" fill="#287958" font-size="12" font-weight="600">that remain physically consistent?</text>
  </g>
  <g>
    <rect x="40" y="364" width="300" height="172" rx="13" fill="#eff7f1" stroke="#a7cbb6"/>
    <g transform="translate(59 382)" fill="none" stroke="#287958" stroke-width="1.6"><path d="M0 0H27V27H0ZM0 9H27M0 18H27M9 0V27M18 0V27"/><path d="M2 23L9 15L16 18L25 5" stroke-width="2.3"/></g>
    <text x="99" y="401" fill="#287958" font-size="11" font-weight="650" letter-spacing="1">PERCEPTION &amp; INTEGRATION</text>
    <text x="60" y="437" fill="#223d42" font-size="18" font-weight="700">Computer vision &amp;</text>
    <text x="60" y="461" fill="#223d42" font-size="18" font-weight="700">multimodal AI</text>
    <text x="60" y="487" fill="#4b626b" font-size="13">Imagery · Terrain · Explainable AI</text>
    <text x="60" y="514" fill="#287958" font-size="12" font-weight="600">Drainage mapping · Vision-language models</text>
  </g>
  <g>
    <rect x="660" y="364" width="300" height="172" rx="13" fill="#f0f6fb" stroke="#a9c8df"/>
    <g transform="translate(680 383)" fill="none" stroke="#2774aa" stroke-width="1.6"><path d="M0 0H27V19H12L5 26V19H0ZM6 6H21M6 12H16"/></g>
    <text x="719" y="401" fill="#245f86" font-size="11" font-weight="650" letter-spacing="1">RESEARCH INTO APPLICATIONS</text>
    <text x="680" y="437" fill="#223d42" font-size="18" font-weight="700">AI systems &amp;</text>
    <text x="680" y="461" fill="#223d42" font-size="18" font-weight="700">scientific applications</text>
    <text x="680" y="487" fill="#4b626b" font-size="13">Reproducible workflows · LLM integration</text>
    <text x="680" y="514" fill="#245f86" font-size="12" font-weight="600">CHIRRP · Agent workflows (ongoing)</text>
  </g>
  <path d="M40 567H960" stroke="#dbe5e3"/>
  <text x="500" y="596" text-anchor="middle" fill="#566a67" font-size="14">Spatial understanding · Multimodal learning · Scientific modeling · Usable AI systems</text>
</svg>