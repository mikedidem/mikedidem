<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Michael Edidem's geospatial AI research framework</title>
  <desc id="description">Geospatial AI connects four research themes: multimodal representation learning, scientific machine learning, remote sensing and computer vision, and environmental decision support. Examples include geospatial foundation models and multimodal features, groundwater conservation diagnostics, drainage-crossing mapping and CHIRRP.</desc>
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2473ae"/><stop offset="1" stop-color="#238468"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e7ecec" stroke-width=".7"/></pattern>
  </defs>
  <rect x="1" y="1" width="998" height="618" rx="22" fill="#fcfdfb" stroke="#dbe5e3"/>
  <text x="40" y="42" fill="#566a67" font-size="12" font-weight="650" letter-spacing="2">RESEARCH CONNECTIONS</text>
  <text x="40" y="74" fill="#223d42" font-size="24" font-weight="700">Learning from place. Testing against physics.</text>
  <g stroke="#c8d8d8" stroke-width="2" fill="none">
    <path d="M340 211C395 211 399 287 416 304"/><path d="M660 211C605 211 601 287 584 304"/>
    <path d="M340 450C395 450 399 374 416 357"/><path d="M660 450C605 450 601 374 584 357"/>
  </g>
  <circle cx="500" cy="330" r="117" fill="url(#grid)" stroke="#e0e8e5"/>
  <circle cx="500" cy="330" r="92" fill="url(#hub)"/>
  <g fill="none" stroke="#fff" opacity=".22" stroke-width="1.2"><ellipse cx="500" cy="330" rx="55" ry="76"/><ellipse cx="500" cy="330" rx="25" ry="76"/><path d="M424 330H576M434 298H566M434 362H566"/></g>
  <text x="500" y="321" text-anchor="middle" fill="#fff" font-size="23" font-weight="750">Geospatial</text>
  <text x="500" y="351" text-anchor="middle" fill="#fff" font-size="23" font-weight="750">AI</text>
  <text x="500" y="476" text-anchor="middle" fill="#455d62" font-size="14" font-weight="600">Map · Predict · Evaluate</text>

  <g>
    <rect x="40" y="122" width="300" height="172" rx="13" fill="#f0f6fb" stroke="#a9c8df"/>
    <g transform="translate(59 140)" fill="none" stroke="#2774aa" stroke-width="1.6"><path d="M0 9L13 2L26 9L13 16ZM0 16L13 23L26 16M0 23L13 30L26 23"/></g>
    <text x="99" y="159" fill="#245f86" font-size="11" font-weight="650" letter-spacing="1">REPRESENTATIONS</text>
    <text x="60" y="195" fill="#223d42" font-size="18" font-weight="700">Multimodal geospatial</text>
    <text x="60" y="219" fill="#223d42" font-size="18" font-weight="700">representation learning</text>
    <text x="60" y="245" fill="#4b626b" font-size="13">GF models · Multimodal features</text>
    <text x="60" y="265" fill="#245f86" font-size="12" font-weight="600">How can we learn from sparse,</text>
    <text x="60" y="283" fill="#245f86" font-size="12" font-weight="600">heterogeneous geospatial data?</text>
  </g>
  <g>
    <rect x="660" y="122" width="300" height="172" rx="13" fill="#eff7f1" stroke="#a7cbb6"/>
    <g transform="translate(680 141)" fill="none" stroke="#287958" stroke-width="1.6"><path d="M0 24V0M0 24H28M4 19L11 12L18 16L26 3"/><circle cx="11" cy="12" r="2" fill="#eff7f1"/><circle cx="18" cy="16" r="2" fill="#eff7f1"/></g>
    <text x="719" y="159" fill="#287958" font-size="11" font-weight="650" letter-spacing="1">PHYSICS &amp; SIMULATION</text>
    <text x="680" y="195" fill="#223d42" font-size="18" font-weight="700">Scientific machine learning</text>
    <text x="680" y="222" fill="#4b626b" font-size="13">Groundwater · Neural surrogates</text>
    <text x="680" y="245" fill="#4b626b" font-size="13">PINNs · Operators · Conservation</text>
    <text x="680" y="265" fill="#287958" font-size="12" font-weight="600">How can we build fast, accurate models</text>
    <text x="680" y="283" fill="#287958" font-size="12" font-weight="600">that remain physically consistent?</text>
  </g>
  <g>
    <rect x="40" y="364" width="300" height="172" rx="13" fill="#eff7f1" stroke="#a7cbb6"/>
    <g transform="translate(59 382)" fill="none" stroke="#287958" stroke-width="1.6"><path d="M0 0H27V27H0ZM0 9H27M0 18H27M9 0V27M18 0V27"/><path d="M2 23L9 15L16 18L25 5" stroke-width="2.3"/></g>
    <text x="99" y="401" fill="#287958" font-size="11" font-weight="650" letter-spacing="1">TERRAIN &amp; IMAGERY</text>
    <text x="60" y="437" fill="#223d42" font-size="18" font-weight="700">Remote sensing &amp;</text>
    <text x="60" y="461" fill="#223d42" font-size="18" font-weight="700">computer vision</text>
    <text x="60" y="487" fill="#4b626b" font-size="13">LiDAR · DEMs · Explainable detection</text>
    <text x="60" y="514" fill="#287958" font-size="12" font-weight="600">Application: drainage-crossing mapping</text>
  </g>
  <g>
    <rect x="660" y="364" width="300" height="172" rx="13" fill="#f0f6fb" stroke="#a9c8df"/>
    <g transform="translate(680 383)" fill="none" stroke="#2774aa" stroke-width="1.6"><path d="M0 0H27V19H12L5 26V19H0ZM6 6H21M6 12H16"/></g>
    <text x="719" y="401" fill="#245f86" font-size="11" font-weight="650" letter-spacing="1">MODELS TO PEOPLE</text>
    <text x="680" y="437" fill="#223d42" font-size="18" font-weight="700">Environmental</text>
    <text x="680" y="461" fill="#223d42" font-size="18" font-weight="700">decision support</text>
    <text x="680" y="487" fill="#4b626b" font-size="13">Scenario exploration · LLM + RAG</text>
    <text x="680" y="514" fill="#245f86" font-size="12" font-weight="600">Application: CHIRRP water planning</text>
  </g>
  <path d="M40 567H960" stroke="#dbe5e3"/>
  <text x="500" y="596" text-anchor="middle" fill="#566a67" font-size="14">Connecting geospatial evidence, physical consistency and usable research software.</text>
</svg>